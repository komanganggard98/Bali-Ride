name: Deploy to Pantheon

on:
  push:
    branches:
      - main # atau 'master' tergantung nama branch default repo kamu

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to Pantheon
        env:
          PANTHEON_GIT_URL: ${{ secrets.PANTHEON_GIT_URL }}
          PANTHEON_SSH_KEY: ${{ secrets.PANTHEON_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$PANTHEON_SSH_KEY" > ~/.ssh/pantheon_id_rsa
          chmod 600 ~/.ssh/pantheon_id_rsa
          
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Tambahkan remote Pantheon dan push paksa branch saat ini
          git remote add pantheon "$PANTHEON_GIT_URL"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/pantheon_id_rsa -o StrictHostKeyChecking=no" git push pantheon HEAD:main --force